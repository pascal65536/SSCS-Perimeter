input {
  file {
    path => "/var/lib/sscs/spool-export/*.jsonl"
    start_position => "beginning"
    sincedb_path => "/var/lib/logstash-sscs/sincedb"
    codec => json_lines
  }
}

filter {
  mutate {
    remove_field => ["host", "agent", "log", "input", "ecs"]
  }
}

output {
  opensearch {
    hosts => ["${SSCS_OPENSEARCH_URL:https://localhost:9200}"]
    index => "sscs-events"
    document_id => "%{[event][id]}"
    action => "create"
    ssl => true
    ssl_certificate_verification => true
  }
}
# Токен не записывается в файл. При использовании аутентификации передайте
# параметры вывода через защищённый Logstash Keystore, а не через settings.json.
